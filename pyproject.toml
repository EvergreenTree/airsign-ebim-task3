[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "airsign-ebim-task3"
version = "0.1.0"
description = "AirSign physically-actuated policy for EBiM Task 3"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.7",
  "httptools==0.6.1",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "numpy==1.26.0",
  "opencv-python-headless==4.11.0.86",
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "uvicorn[standard]==0.29.0",
]

[project.scripts]
airsign-task3 = "airsign_task3.main:main"

[tool.setuptools.packages.find]
include = ["airsign_task3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
